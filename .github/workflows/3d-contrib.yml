# 每天生成 3D 贡献图（等距天际线），提交进仓库，README 直接引用
name: Generate 3D Contrib

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = 北京时间每天早上 10 点（与卡片 8 点、贪吃蛇 9 点错开）
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: update 3d contribution graph [skip ci]"
          git push
