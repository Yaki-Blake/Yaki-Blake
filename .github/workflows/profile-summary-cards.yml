# 每天自动生成 GitHub 统计卡片 SVG 并提交到本仓库，README 引用仓库内图片，不再依赖外部服务
name: Profile Summary Cards

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间每天早上 8 点
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github    # 跟随 GitHub 默认亮色主题

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet || git commit -m "chore: update profile summary cards [skip ci]"
          git push
